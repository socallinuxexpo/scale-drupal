uuid: 2cd2c924-143d-47d9-8603-8a102d37f3fe
langcode: en
status: true
dependencies:
  config:
    - node.type.session
  module:
    - content_moderation
id: session_workflow
label: 'Session Workflow'
type: content_moderation
type_settings:
  states:
    draft:
      label: 'Pending Review'
      weight: 0
      published: false
      default_revision: false
    published:
      label: Accepted
      weight: 1
      published: true
      default_revision: true
    unpublished:
      label: Rejected
      weight: 2
      published: false
      default_revision: true
  transitions:
    accept_session:
      label: 'Accept Session'
      from:
        - draft
      to: published
      weight: 0
    back_to_draft:
      label: 'Back to Draft'
      from:
        - published
        - unpublished
      to: draft
      weight: 2
    edit_accepted:
      label: 'Edit Accepted'
      from:
        - published
      to: published
      weight: -1
    edit_draft:
      label: 'Edit Draft'
      from:
        - draft
      to: draft
      weight: -2
    reject_session:
      label: 'Reject Session'
      from:
        - draft
        - published
        - unpublished
      to: unpublished
      weight: 1
  entity_types:
    node:
      - session
  default_moderation_state: draft
