uuid: 2c147f4f-2728-4341-b22e-b30b239a3660
langcode: en
status: true
dependencies: {  }
id: type_basic_page
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: default
label: 'Basic Page Type'
source:
  plugin: type_basic_page_source
  track_changes: true
  constants:
    DRUPAL_FILE_DIRECTORY: 'public://'
process:
  type:
    plugin: default_value
    default_value: page
  title: title
  created: created
  status: published
  pseudo_folder_date:
    -
      plugin: format_date
      source: created
      from_format: U
      to_format: Y-m
  pseudo_folder_directory:
    plugin: concat
    source:
      - constants/DRUPAL_FILE_DIRECTORY
      - '@pseudo_folder_date'
  pseudo_destination_path:
    plugin: concat
    source:
      - '@pseudo_folder_directory'
      - filename
    delimiter: /
  field_image:
    -
      plugin: skip_on_empty
      source: image/src
      method: process
      message: 'Cannot import empty image filename.'
    -
      plugin: skip_on_404
      method: process
      message: 'Cannot reach the image at that URI.'
    -
      plugin: file_import
      destination: '@pseudo_destination_path'
      file_exists: replace
  field_image/alt: image/alt
  field_image/title: image/title
  body/value: body
  body/format:
    plugin: default_value
    default_value: full_html
  body/summary: body_summary
  field_legacy_nid: nid
  field_scale_event:
    -
      plugin: skip_on_empty
      source: event
      method: process
      message: 'Skipping empty event.'
    -
      plugin: entity_generate
  field_ready_for_approval: ready_for_approval
  path/alias: path
  path/pathauto:
    plugin: default_value
    default_value: 1
destination:
  plugin: 'entity:node'
migration_dependencies: null
