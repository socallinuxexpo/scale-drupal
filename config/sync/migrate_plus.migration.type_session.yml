uuid: 27f8b94b-69f7-4bf6-991a-f679576c23e0
langcode: en
status: true
dependencies: {  }
id: type_session
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: default
label: 'Session Type'
source:
  plugin: type_session_source
  track_changes: true
  constants:
    DRUPAL_FILE_DIRECTORY: 'public://'
process:
  type:
    plugin: default_value
    default_value: session
  title: title
  created: created
  status: published
  field_session_level:
    plugin: entity_generate
    source: audience
  field_session_track:
    plugin: entity_generate
    source: topic
  field_tags:
    -
      plugin: skip_on_empty
      source: tags
      method: process
      message: 'Skipping empty tags.'
    -
      plugin: explode
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  field_rating:
    plugin: entity_generate
    source: rating
  field_legacy_nid: nid
  body/value: long_abstract
  body/format:
    plugin: default_value
    default_value: basic_html
  body/summary: short_abstract
  field_audio_video/value: audio_video
  field_audio_video/format:
    plugin: default_value
    default_value: full_html
  field_long_abstract/value: long_abstract
  field_long_abstract/format:
    plugin: default_value
    default_value: basic_html
  field_short_abstract/value: short_abstract
  field_short_abstract/format:
    plugin: default_value
    default_value: basic_html
  field_moderation_message/value: moderation_message
  field_link_to_presentation/title: link_to_prezi__title
  field_link_to_presentation/uri: link_to_prezi__url
  field_primary_contact: primary_contact
  field_scale_events:
    -
      plugin: explode
      source: scale_event
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  field_session_room:
    -
      plugin: skip_on_empty
      source: room
      method: process
      message: 'Skipping empty room.'
    -
      plugin: explode
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  field_session_room_overflow:
    -
      plugin: skip_on_empty
      source: room_overflow
      method: process
      message: 'Skipping empty room_overflow.'
    -
      plugin: explode
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  field_speakers_ref:
    -
      plugin: skip_on_empty
      source: speakers
      method: process
      message: 'Skipping empty speakers.'
    -
      plugin: explode
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  pseudo_folder_date:
    -
      plugin: format_date
      source: created
      from_format: U
      to_format: Y-m
  pseudo_folder_directory:
    plugin: concat
    source:
      - constants/DRUPAL_FILE_DIRECTORY
      - '@pseudo_folder_date'
  pseudo_destination_path:
    plugin: concat
    source:
      - '@pseudo_folder_directory'
      - filename
    delimiter: /
  field_assets:
    -
      plugin: skip_on_empty
      source: uploaded_file
      method: process
      message: 'Skipping empty assets.'
    -
      plugin: skip_on_404
      method: process
      message: 'Cannot reach the image at that URI.'
    -
      plugin: file_import
      source: uploaded_file
      destination: '@pseudo_destination_path'
  field_time_slot/value:
    -
      plugin: format_date
      source: slot_start
      from_format: 'Y-m-d H:i:s'
      to_format: 'Y-m-d\TH:i:s'
      from_timezone: America/New_York
      to_timezone: America/Los_Angeles
  field_time_slot/end_value:
    -
      plugin: format_date
      source: slot_end
      from_format: 'Y-m-d H:i:s'
      to_format: 'Y-m-d\TH:i:s'
      from_timezone: America/New_York
      to_timezone: America/Los_Angeles
  path/pathauto:
    plugin: default_value
    default_value: 1
  path/alias: path
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - user_speaker
    - tax_room
    - tax_event
