uuid: 1e65bba1-0c32-4f64-a458-c11d5a251583
langcode: en
status: true
dependencies: {  }
id: type_blog
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: default
label: 'Blog Type'
source:
  plugin: type_blog_source
  track_changes: true
  constants:
    DRUPAL_FILE_DIRECTORY: 'public://'
process:
  type:
    plugin: default_value
    default_value: article
  title: title
  created: created
  status: published
  field_tags:
    -
      plugin: skip_on_empty
      method: process
      source: tags
      message: 'Empty tags.'
    -
      plugin: explode
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  pseudo_folder_date:
    -
      plugin: format_date
      source: created
      from_format: U
      to_format: Y-m
  pseudo_folder_directory:
    plugin: concat
    source:
      - constants/DRUPAL_FILE_DIRECTORY
      - '@pseudo_folder_date'
  pseudo_destination_path:
    plugin: concat
    source:
      - '@pseudo_folder_directory'
      - filename
    delimiter: /
  field_article_image:
    -
      plugin: skip_on_empty
      source: image/src
      method: process
      message: 'Cannot import empty image filename.'
    -
      plugin: skip_on_404
      method: process
      message: 'Cannot reach the image at that URI.'
    -
      plugin: file_import
      destination: '@pseudo_destination_path'
  field_article_image/alt: title
  body/value: body
  body/format:
    plugin: default_value
    default_value: basic_html
  body/summary: body_summary
  field_scale_events:
    -
      plugin: explode
      source: scale_event
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  path/pathauto:
    plugin: default_value
    default_value: 1
  path/alias: path
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - tax_event
