uuid: fad01f45-7da8-426c-b5c5-c4f7da942d6d
langcode: en
status: true
dependencies: {  }
id: type_sponsor
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: default
label: 'Sponsor Type'
source:
  plugin: type_sponsor_source
  track_changes: true
  constants:
    DRUPAL_FILE_DIRECTORY: 'public://'
process:
  type:
    plugin: default_value
    default_value: sponsor
  title: title
  created: created
  status: published
  field_legacy_nid: nid
  field_ready_for_approval: ready_for_approval
  field_booth_number: booth
  field_scale_event:
    -
      plugin: skip_on_empty
      method: row
      source: scale_event
      message: 'Skipping empty SCaLE Event.'
    -
      plugin: explode
      source: scale_event
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  field_sponsor_tier:
    -
      plugin: skip_on_empty
      method: process
      source: sponsor_tier
      message: 'Skipping empty sponsor tier.'
    -
      plugin: explode
      source: sponsor_tier
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  field_sponsor_type:
    -
      plugin: explode
      source: sponsor_type
      delimiter: ','
    -
      plugin: trim
    -
      plugin: entity_generate
  field_exhibitor_type:
    -
      plugin: entity_generate
      source: exhibitor_type
  field_sponsor_bio/value: body
  field_sponsor_bio/format:
    plugin: default_value
    default_value: basic_html
  field_sponsor_bio/summary: body_summary
  field_sponsor_website/uri: website_url
  pseudo_folder_date:
    -
      plugin: format_date
      source: created
      from_format: U
      to_format: Y-m
  pseudo_folder_directory:
    plugin: concat
    source:
      - constants/DRUPAL_FILE_DIRECTORY
      - '@pseudo_folder_date'
  pseudo_destination_path:
    plugin: concat
    source:
      - '@pseudo_folder_directory'
      - filename
    delimiter: /
  field_sponsor_logo:
    -
      plugin: skip_on_empty
      source: logo/src
      method: process
      message: 'Cannot import empty image filename.'
    -
      plugin: skip_on_404
      method: process
      message: 'Cannot reach the image at that URI.'
    -
      plugin: file_import
      source: logo/src
      destination: '@pseudo_destination_path'
      file_exists: replace
  field_sponsor_logo/alt: title
  path/pathauto:
    plugin: default_value
    default_value: 0
  path/alias: path
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - tax_event
