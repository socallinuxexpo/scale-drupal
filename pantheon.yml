# Put overrides to your pantheon.upstream.yml file here.
# For more information, see: https://pantheon.io/docs/pantheon-yml/
api_version: 1

protected_web_paths:
  - /private

workflows:
  sync_code:
    after:
      - type: webphp
        description: Run deploys
        script: private/scripts/drush_deploy.php
  deploy:
    after:
      - type: webphp
        description: Run deploys
        script: private/scripts/drush_deploy.php
  clone_database:
    after:
      - type: webphp
        description: Run deploys
        script: private/scripts/drush_deploy.php
