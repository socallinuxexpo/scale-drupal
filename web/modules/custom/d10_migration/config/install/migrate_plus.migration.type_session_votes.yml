langcode: en
status: true
dependencies: { }
id: type_session_votes
class: null
migration_group: default
label: 'Session Votes'
source:
  plugin: type_session_votes_source
  track_changes: true
process:
  value: score
  entity_type:
    plugin: default_value
    default_value: node
  entity_id:
    - plugin: migration_lookup
      migration: type_session
      source: nid
      no_stub: true
    - plugin: skip_on_empty
      method: row
      message: "nid is missing"
  user_id:
    - plugin: migration_lookup
      migration: user
      source: uid
      no_stub: true
    - plugin: skip_on_empty
      method: row
      message: "uid is missing"
  created: created
destination:
  plugin: 'entity:vote'
  default_bundle: 'vote_type'
migration_dependencies:
  required:
    - user
    - type_session
