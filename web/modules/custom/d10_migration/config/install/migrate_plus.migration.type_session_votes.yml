langcode: en
status: true
dependencies: { }
id: type_session_votes
class: null
migration_group: default
label: 'Session Votes'
source:
  plugin: type_session_votes_source
  track_changes: true
process:
  type:
    plugin: default_value
    default_value: session_approval
  created: created
  value: score
  entity_type:
    plugin: default_value
    default_value: node
  entity_id:
    - plugin: skip_on_empty
      source: nid
      method: row
      message: "nid is missing"
    - plugin: migration_lookup
      migration: type_session
      source: nid
      no_stub: true
  user_id:
    - plugin: skip_on_empty
      source: uid
      method: row
      message: "uid is missing"
    - plugin: migration_lookup
      migration: user
      source: uid
      no_stub: true
destination:
  plugin: entity:vote
  default_bundle: session_approval
migration_dependencies:
  required:
    - user
    - type_session
