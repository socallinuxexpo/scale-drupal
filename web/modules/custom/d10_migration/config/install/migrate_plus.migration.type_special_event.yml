langcode: en
status: true
dependencies: { }
id: type_special_event
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: default
label: 'Special Event Type'
source:
  plugin: type_special_event_source
  track_changes: true
  constants:
    DRUPAL_FILE_DIRECTORY: 'public://'
process:
  type:
    plugin: default_value
    default_value: special_event
  title: title
  created: created
  status: published
  pseudo_folder_date:
    - plugin: format_date
      source: created
      from_format: U
      to_format: Y-m
  pseudo_folder_directory:
    plugin: concat
    source:
      - constants/DRUPAL_FILE_DIRECTORY
      - '@pseudo_folder_date'
  pseudo_destination_path:
    plugin: concat
    source:
      - '@pseudo_folder_directory'
      - filename
    delimiter: /
  field_special_event_image:
    - plugin: skip_on_empty
      source: logo/src
      method: process
      message: 'Cannot import empty image filename.'
    - plugin: skip_on_404
      method: process
      message: 'Cannot reach the image at that URI.'
    - plugin: file_import
      destination: '@pseudo_destination_path'
      file_exists: replace
  field_special_event_image/alt: logo/alt
  field_special_event_image/title: logo/title
  field_schedule/value: schedule
  field_schedule/format:
    plugin: default_value
    default_value: full_html
  body/value: body
  body/format:
    plugin: default_value
    default_value: full_html
  body/summary: body_summary
  field_when/value:
    - plugin: format_date
      source: start
      from_format: U
      to_format: Y-m-d\TH:i:s
      from_timezone: America/Los_Angeles
      to_timezone: UTC
  field_when/end_value:
    - plugin: format_date
      source: end
      from_format: U
      to_format: Y-m-d\TH:i:s
      from_timezone: America/Los_Angeles
      to_timezone: UTC
  field_legacy_nid: nid
  field_scale_event:
    - plugin: skip_on_empty
      source: scale_event
      method: process
      message: 'Skipping empty event.'
    - plugin: entity_generate
  field_sponsors_ref:
    - plugin: skip_on_empty
      source: sponsor
      method: process
    - plugin: explode
      delimiter: ','
    - plugin: trim
    - plugin: entity_generate
      bundle: sponsor
      entity_type: node
      lookup_field: title
  field_ready_for_approval: ready_for_approval
  path/alias: path
  path/pathauto:
    plugin: default_value
    default_value: 1
# TODO: Moderation State
# @see https://www.drupal.org/project/drupal/issues/3157105#comment-13830538
destination:
  plugin: 'entity:node'
