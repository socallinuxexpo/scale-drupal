langcode: en
status: true
dependencies: { }
id: user_speaker
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: default
label: 'User Speaker'
source:
  plugin: user_speaker_source
  track_changes: true
  constants:
    DRUPAL_FILE_DIRECTORY: 'public://'
process:
  type:
    plugin: default_value
    default_value: speaker
  title: name
  created: created
  field_legacy_uid: uid
  status:
    plugin: default_value
    default_value: 1
  field_first_name: first_name
  field_last_name: last_name
  field_job_title: job_title
  field_organization: organization
  field_website: website
  field_twitter_profile: twitter
  body/value: bio
  body/format:
    plugin: default_value
    default_value: basic_html
  pseudo_folder_date:
    - plugin: format_date
      source: created
      from_format: U
      to_format: Y-m
  pseudo_folder_directory:
    plugin: concat
    source:
      - constants/DRUPAL_FILE_DIRECTORY
      - '@pseudo_folder_date'
  pseudo_destination_path:
    plugin: concat
    source:
      - '@pseudo_folder_directory'
      - filename
    delimiter: /
  field_profile_photo:
    - plugin: skip_on_empty
      source: photo/src
      method: process
      message: 'Cannot import empty image filename.'
    - plugin: skip_on_404
      method: process
      message: 'Cannot reach the image at that URI.'
    - plugin: file_import
      destination: '@pseudo_destination_path'
  field_profile_photo/alt: name
  field_user_account:
    - plugin: skip_on_empty
      method: process
      source: uid
    - plugin: migration_lookup
      migration: user
  path/pathauto:
    plugin: default_value
    default_value: 1
  path/alias: path
# TODO: Moderation State
# @see https://www.drupal.org/project/drupal/issues/3157105#comment-13830538
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - user
