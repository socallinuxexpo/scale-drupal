langcode: en
status: true
dependencies: { }
id: user_speaker
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: default
label: 'User Speaker'
source:
  plugin: user_speaker_source
  track_changes: true
  constants:
    DRUPAL_FILE_DIRECTORY: 'public://'
process:
  type:
    plugin: default_value
    default_value: speaker
  created: created
  field_legacy_uid: uid
  status:
    plugin: default_value
    default_value: 1
  field_email:
    - plugin: callback
      callable: html_entity_decode
      source: email
  field_phone: phone
  field_first_name:
    - plugin: callback
      callable: html_entity_decode
      source: first_name
  field_last_name:
    - plugin: callback
      callable: html_entity_decode
      source: last_name
  field_job_title:
    - plugin: callback
      callable: html_entity_decode
      source: job_title
  field_organization:
    - plugin: callback
      callable: html_entity_decode
      source: organization
  field_website:
    - plugin: callback
      callable: urldecode
      source: website
  field_twitter_profile:
    - plugin: callback
      callable: urldecode
      source: twitter
  body/value: bio
  body/format:
    plugin: default_value
    default_value: basic_html
  pseudo_folder_date:
    - plugin: format_date
      source: created
      from_format: U
      to_format: Y-m
  pseudo_folder_directory:
    plugin: concat
    source:
      - constants/DRUPAL_FILE_DIRECTORY
      - '@pseudo_folder_date'
  pseudo_destination_path:
    plugin: concat
    source:
      - '@pseudo_folder_directory'
      - filename
    delimiter: /
  field_profile_photo:
    - plugin: skip_on_empty
      source: photo/src
      method: process
      message: 'Cannot import empty image filename.'
    - plugin: skip_on_404
      method: process
      message: 'Cannot reach the image at that URI.'
    - plugin: file_import
      destination: '@pseudo_destination_path'
  field_profile_photo/alt:
    - plugin: callback
      callable: html_entity_decode
      source: name
  field_user_account:
    - plugin: skip_on_empty
      method: process
      source: uid
    - plugin: migration_lookup
      migration: user
  field_marital_status:
    - plugin: skip_on_empty
      source: marital_status
      method: process
      message: 'Skipping empty marital_status.'
    - plugin: entity_generate
      source: marital_status
      value_key: name
      bundle_key: vid
      bundle: user_marital_status
      entity_type: taxonomy_term
      values:
        name: marital_status
  field_household_income:
    - plugin: skip_on_empty
      source: household_income
      method: process
      message: 'Skipping empty household_income.'
    - plugin: entity_generate
      source: household_income
      value_key: name
      bundle_key: vid
      bundle: user_household_income
      entity_type: taxonomy_term
      values:
        name: household_income
  field_ethnicity:
    - plugin: skip_on_empty
      source: ethnicity
      method: process
      message: 'Skipping empty ethnicity.'
    - plugin: entity_generate
      source: ethnicity
      value_key: name
      bundle_key: vid
      bundle: user_ethnicity
      entity_type: taxonomy_term
      values:
        name: ethnicity
  field_gender:
    - plugin: skip_on_empty
      source: gender
      method: process
      message: 'Skipping empty gender.'
    - plugin: entity_generate
      source: gender
      value_key: name
      bundle_key: vid
      bundle: user_gender
      entity_type: taxonomy_term
      values:
        name: gender
  field_postal_code: postal_code
  field_age:
    - plugin: skip_on_empty
      source: age
      method: process
      message: 'Skipping empty age.'
    - plugin: entity_generate
      source: age
      value_key: name
      bundle_key: vid
      bundle: user_age
      entity_type: taxonomy_term
      values:
        name: age
  field_education:
    - plugin: skip_on_empty
      source: education
      method: process
      message: 'Skipping empty education.'
    - plugin: entity_generate
      source: education
      value_key: name
      bundle_key: vid
      bundle: user_education
      entity_type: taxonomy_term
      values:
        name: education
  field_employment_status:
    - plugin: skip_on_empty
      source: employment
      method: process
      message: 'Skipping empty employment.'
    - plugin: entity_generate
      source: employment
      value_key: name
      bundle_key: vid
      bundle: user_employment
      entity_type: taxonomy_term
      values:
        name: employment
  path/pathauto:
    plugin: default_value
    default_value: 1
  path/alias: path
# TODO: Moderation State
# @see https://www.drupal.org/project/drupal/issues/3157105#comment-13830538
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - user
