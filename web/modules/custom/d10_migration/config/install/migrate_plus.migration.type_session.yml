langcode: en
status: true
dependencies: { }
id: type_session
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: default
label: 'Session Type'
source:
  plugin: type_session_source
  track_changes: true
  constants:
    DRUPAL_FILE_DIRECTORY: 'public://'
process:
  type:
    plugin: default_value
    default_value: session
  title: title
  created: created
  status: published
  field_session_level:
    plugin: entity_generate
    source: audience
  field_session_track:
    plugin: entity_generate
    source: topic
  field_tags:
    - plugin: skip_on_empty
      source: tags
      method: process
      message: 'Skipping empty tags.'
    - plugin: explode
      delimiter: ','
    - plugin: trim
    - plugin: entity_generate
  field_rating:
    plugin: entity_generate
    source: rating
  field_legacy_nid: nid
  body/value: long_abstract
  body/format:
    plugin: default_value
    default_value: basic_html
  body/summary: short_abstract
  field_audio_video/value: audio_video
  field_long_abstract/value: long_abstract
  field_short_abstract/value: short_abstract
  field_moderation_message/value: moderation_message
  field_link_to_presentation/title: link_to_prezi__title
  field_link_to_presentation/uri: link_to_prezi__url
  field_primary_contact: primary_contact
  field_scale_events:
    - plugin: explode
      source: scale_event
      delimiter: ','
    - plugin: trim
    - plugin: entity_generate
  field_session_room:
    - plugin: skip_on_empty
      source: room
      method: process
      message: 'Skipping empty room.'
    - plugin: explode
      delimiter: ','
    - plugin: trim
    - plugin: entity_generate
  field_session_room_overflow:
    - plugin: skip_on_empty
      source: room_overflow
      method: process
      message: 'Skipping empty room_overflow.'
    - plugin: explode
      delimiter: ','
    - plugin: trim
    - plugin: entity_generate
  field_speakers_ref:
    - plugin: skip_on_empty
      source: speakers
      method: process
      message: 'Skipping empty speakers.'
    - plugin: explode
      delimiter: ','
    - plugin: trim
    - plugin: entity_generate
  path/pathauto:
    plugin: default_value
    default_value: 1
  path/alias: path
# TODO: Moderation State
# @see https://www.drupal.org/project/drupal/issues/3157105#comment-13830538
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - tax_room
    - tax_event
    - user
